name: Build All Platforms (Windows, Arch Linux, Linux, Android, Web)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web-pwa:
    name: Web / PWA (iOS & Browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Archive Web PWA
        run: cd dist && zip -r ../omniplay-web-pwa.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-web-pwa
          path: omniplay-web-pwa.zip

  build-windows:
    name: Windows (x64 NSIS & MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm install
      - name: Generate App Icons & Build Windows Installer
        run: |
          node scripts/gen-icon.cjs
          npx tauri icon public/icon.png
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    name: Linux Universal (AppImage, DEB, RPM)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm install
      - name: Generate App Icons & Build Linux Bundles
        run: |
          node scripts/gen-icon.cjs
          npx tauri icon public/icon.png
          npx tauri build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  build-arch-linux:
    name: Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch Linux build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            nodejs \
            npm \
            rust \
            cargo \
            webkit2gtk-4.1 \
            gtk3 \
            libayatana-appindicator \
            librsvg \
            openssl \
            curl \
            wget \
            file \
            patchelf
      - uses: actions/checkout@v4
      - name: Build native Arch package (.pkg.tar.zst)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su - builder -c "cd '$PWD' && npm install && node scripts/gen-icon.cjs && npx tauri icon public/icon.png && npm run build && cd src-tauri && cargo build --release"
          mkdir -p /tmp/archpkg
          cp packaging/arch/PKGBUILD /tmp/archpkg/
          cp packaging/arch/omniplay.desktop /tmp/archpkg/
          cp src-tauri/target/release/omniplay /tmp/archpkg/omniplay-bin
          cp src-tauri/icons/128x128.png /tmp/archpkg/omniplay.png
          chown -R builder:builder /tmp/archpkg
          su - builder -c "cd /tmp/archpkg && makepkg -f --noconfirm"
          mkdir -p dist-arch
          cp /tmp/archpkg/*.pkg.tar.zst dist-arch/
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-arch-linux-x86_64
          path: dist-arch/*.pkg.tar.zst

  build-android:
    name: Android Mobile (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK & SDK 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm install
      - name: Initialize & Build Signed Android APK
        run: |
          node scripts/gen-icon.cjs
          npx tauri icon public/icon.png
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64
          mkdir -p dist-android
          keytool -genkey -v -keystore /tmp/omniplay.keystore -alias omniplay -keyalg RSA -keysize 2048 -validity 10000 -storepass omniplay123 -keypass omniplay123 -dname "CN=OmniPlay, OU=App, O=OmniPlay, L=Net, S=Net, C=DE"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED" /tmp/omniplay-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks /tmp/omniplay.keystore --ks-pass pass:omniplay123 --key-pass pass:omniplay123 --out dist-android/omniplay-android-arm64.apk /tmp/omniplay-aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-android-apk
          path: dist-android/*.apk

  release:
    name: Publish GitHub Release
    needs: [build-web-pwa, build-windows, build-linux, build-arch-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/**/*
